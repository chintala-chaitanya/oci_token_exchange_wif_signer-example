name: Test OCI WIF Signer

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install oci requests

      - name: Run OCI WIF Signer Example
        env:
          region: ${{ secrets.region }}
          resource_ocid: ${{ secrets.resource_ocid }}
          oci_domain_id: ${{ secrets.oci_domain_id }}
          oci_client_id: ${{ secrets.oci_client_id }}
          oci_client_secret: ${{ secrets.oci_client_secret }}
        run: |
          python examples/workload_identity_federation_signer_example.py
